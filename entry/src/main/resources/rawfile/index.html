<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ArkWeb Bridge</title>
  <style>
    :root { --accent: #24C39A; --accent-dim: #16332C; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #ECEFF1;
      font-family: -apple-system, "HarmonyOS Sans", sans-serif;
      overflow: hidden;
    }
    #scroll { width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #stage {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center;
      /* Safe padding; hero is centered so it can sit near the top */
      padding: 11% 8% 24% 8%;
    }

    /* ---- Codelab framing / bridge indicator ---- */
    .topbar { width: 100%; display: flex; flex-direction: column; align-items: center; margin: 0 0 16px; }
    .app-title { font-size: 15px; font-weight: 700; color: #FFF; margin: 0; letter-spacing: .3px; }
    .bridge {
      display: flex; align-items: center; gap: 8px; margin: 8px 0 5px;
      background: #101418; border: 1px solid #1E2A26; border-radius: 14px; padding: 4px 12px;
    }
    .bridge .node { font-size: 11px; font-weight: 600; color: #C7CBD1; }
    .bridge .arrow { font-size: 14px; color: #4A5057; transition: color .2s, text-shadow .2s; }
    .bridge.active .arrow { color: var(--accent); text-shadow: 0 0 7px var(--accent); }
    .app-sub { font-size: 10px; color: #8A9099; margin: 0; white-space: nowrap; }

    /* ---- Hero health tile ---- */
    .hero { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .ring-wrap { position: relative; width: 138px; height: 138px; }
    .ring-wrap svg { width: 138px; height: 138px; transform: rotate(-90deg); }
    #ringArc { transition: stroke-dashoffset .6s ease; }
    .ring-center {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .heart { font-size: 12px; color: var(--accent); line-height: 1; margin-bottom: 1px; }
    .heart.beat { animation: beat .5s ease; }
    @keyframes beat { 0%{transform:scale(1)} 30%{transform:scale(1.4)} 100%{transform:scale(1)} }
    .hr-num { font-size: 33px; font-weight: 700; color: #FFF; line-height: 1; }
    .hr-unit { font-size: 10px; color: #8A9099; margin-top: 2px; letter-spacing: 1px; }
    #steps { font-size: 15px; color: #E4E7EB; margin: 16px 0 3px; font-weight: 600; }
    .hero-cap { font-size: 10px; color: var(--accent); opacity: .85; margin: 0; }
    .ring-wrap.flash svg #ringArc { filter: drop-shadow(0 0 6px var(--accent)); }

    /* ---- Sync action ---- */
    .sync { width: 100%; margin: 26px 0 0; }
    button.primary {
      width: 100%; border: none; border-radius: 20px;
      padding: 14px; font-size: 14px; font-weight: 700; color: #04140F;
      background: var(--accent);
    }
    button.primary:active { background: #1CA482; }
    #syncNote { font-size: 11px; color: #8A9099; text-align: center; margin: 9px 0 0; min-height: 14px; }
    #syncNote.ok { color: var(--accent); }

    /* ---- Bridge self-test (secondary) ---- */
    .selftest {
      width: 100%; margin: 30px 0 0;
      border-top: 1px solid #1A1F24; padding-top: 16px;
    }
    .st-head { font-size: 12px; font-weight: 600; color: #8A9099; margin: 0 0 2px; }
    .st-cap { font-size: 10px; color: #5C6169; margin: 0 0 12px; line-height: 1.3; }
    button.secondary {
      width: 100%; border: 1px solid var(--accent-dim); border-radius: 16px;
      padding: 10px; font-size: 12px; font-weight: 600;
      color: var(--accent); background: transparent;
    }
    button.secondary:active { background: #0C1A15; }
    ul#checks { list-style: none; margin: 12px 0 0; padding: 0; }
    ul#checks li {
      display: flex; align-items: center;
      font-size: 12px; color: #6B7178; padding: 7px 2px;
      border-bottom: 1px solid #14181C;
    }
    ul#checks li:last-child { border-bottom: none; }
    ul#checks li .mark {
      width: 18px; display: inline-block; text-align: center; margin-right: 10px; color: #3A4046;
    }
    ul#checks li.ok { color: var(--accent); }
    ul#checks li.ok .mark { color: var(--accent); }
    ul#checks li .name { font-weight: 600; }
    ul#checks li .desc { margin-left: 6px; font-weight: 400; font-size: 11px; opacity: .8; }
  </style>
</head>
<body>
  <div id="scroll">
    <div id="stage">

      <!-- Codelab framing: what this app is + a live bridge indicator -->
      <div class="topbar">
        <p class="app-title">ArkWeb Bridge</p>
        <div class="bridge" id="bridge">
          <span class="node">H5</span>
          <span class="arrow">&#8646;</span>
          <span class="node">Native</span>
        </div>
        <p class="app-sub">live data over a web &lt;-&gt; native bridge</p>
      </div>

      <!-- HERO: live heart-rate ring, streamed from native -->
      <div class="hero">
        <div class="ring-wrap" id="ringWrap">
          <svg viewBox="0 0 190 190">
            <circle cx="95" cy="95" r="82" fill="none" stroke="#181D22" stroke-width="14" />
            <circle id="ringArc" cx="95" cy="95" r="82" fill="none" stroke="#24C39A"
                    stroke-width="14" stroke-linecap="round"
                    stroke-dasharray="515.2" stroke-dashoffset="515.2" />
          </svg>
          <div class="ring-center">
            <div class="heart" id="heart">&#9829;</div>
            <div class="hr-num" id="hr">--</div>
            <div class="hr-unit">BPM</div>
          </div>
        </div>
        <div id="steps">-- steps</div>
        <p class="hero-cap">live &middot; from native</p>
      </div>

      <!-- SYNC: on-demand wearable://sensor fetch -->
      <div class="sync">
        <button id="btnRequest" class="primary">Sync from native</button>
        <div id="syncNote"></div>
      </div>

      <!-- BRIDGE SELF-TEST: secondary diagnostic -->
      <div class="selftest">
        <p class="st-head">Bridge self-test</p>
        <p class="st-cap">Sends each JS type across and back</p>
        <button id="btnSend" class="secondary">Run</button>
        <ul id="checks">
          <li id="row-string"><span class="mark">&#9675;</span><span class="name">text</span><span class="desc">string carried</span></li>
          <li id="row-number"><span class="mark">&#9675;</span><span class="name">number</span><span class="desc">42 carried</span></li>
          <li id="row-json"><span class="mark">&#9675;</span><span class="name">JSON</span><span class="desc">object carried</span></li>
          <li id="row-buffer"><span class="mark">&#9675;</span><span class="name">bytes</span><span class="desc">buffer(8) carried</span></li>
          <li id="row-error"><span class="mark">&#9675;</span><span class="name">error</span><span class="desc">Error type carried</span></li>
        </ul>
      </div>

    </div>
  </div>

  <script>
    let hrEl = document.getElementById('hr');
    let stepsEl = document.getElementById('steps');
    let heartEl = document.getElementById('heart');
    let ringArc = document.getElementById('ringArc');
    let ringWrap = document.getElementById('ringWrap');
    let syncNote = document.getElementById('syncNote');
    let h5Port = null;

    let RING_LEN = 515.2;
    let HR_MIN = 40, HR_MAX = 180;

    function renderHr(bpm) {
      hrEl.textContent = String(bpm);
      let frac = (bpm - HR_MIN) / (HR_MAX - HR_MIN);
      if (frac < 0) { frac = 0; } else if (frac > 1) { frac = 1; }
      ringArc.setAttribute('stroke-dashoffset', String(RING_LEN * (1 - frac)));
      heartEl.classList.remove('beat');
      void heartEl.offsetWidth;
      heartEl.classList.add('beat');
    }

    function flashRing() {
      ringWrap.classList.add('flash');
      setTimeout(function () { ringWrap.classList.remove('flash'); }, 600);
    }

    let bridgeEl = document.getElementById('bridge');
    let bridgeTimer = null;
    function pulseBridge() {
      bridgeEl.classList.add('active');
      if (bridgeTimer) { clearTimeout(bridgeTimer); }
      bridgeTimer = setTimeout(function () { bridgeEl.classList.remove('active'); }, 320);
    }

    function markOk(rowId) {
      let li = document.getElementById(rowId);
      if (!li) { return; }
      li.classList.add('ok');
      li.querySelector('.mark').textContent = '✓';
    }

    function handleAck(detail) {
      if (detail.indexOf('arrayBuffer') === 0) {
        markOk('row-buffer');
      } else if (detail.indexOf('number=') === 0) {
        markOk('row-number');
      } else if (detail.indexOf('error ') === 0) {
        markOk('row-error');
      } else if (detail.indexOf('string="{') === 0) {
        markOk('row-json');
      } else if (detail.indexOf('string=') === 0) {
        markOk('row-string');
      }
    }

    window.addEventListener('message', function (event) {
      if (event.data !== '__init_port__' || !event.ports || event.ports[0] == null) {
        return;
      }
      h5Port = event.ports[0];
      h5Port.onmessage = function (msg) {
        pulseBridge();
        let result = msg.data;
        if (typeof result === 'number') {
          renderHr(result);
        } else if (typeof result === 'string') {
          if (result.indexOf('ack:') === 0) {
            handleAck(result.slice(4));
          } else if (result.indexOf('live:') === 0) {
            let body = result.slice(5);
            let m = body.match(/(\d+)\s+steps/);
            stepsEl.textContent = (m ? Number(m[1]).toLocaleString() : '--') + ' steps';
          }
        }
      };
    });

    document.getElementById('btnSend').addEventListener('click', function () {
      if (!h5Port) { return; }
      pulseBridge();
      h5Port.postMessage('hello from H5');
      h5Port.postMessage(42);
      h5Port.postMessage(JSON.stringify({ view: 'watch', ok: true }));

      let buf = new ArrayBuffer(8);
      let u8 = new Uint8Array(buf);
      for (let i = 0; i < u8.length; i++) { u8[i] = i; }
      h5Port.postMessage(buf);

      h5Port.postMessage(new ReferenceError('demo error'));
    });

    document.getElementById('btnRequest').addEventListener('click', function () {
      pulseBridge();
      syncNote.className = '';
      syncNote.textContent = 'Requesting…';
      fetch('wearable://sensor?ts=' + Date.now())
        .then(function (r) {
          if (!r.ok) { throw new Error('HTTP ' + r.status); }
          return r.json();
        })
        .then(function (data) {
          syncNote.className = 'ok';
          syncNote.textContent =
            'native → ' + data.heartRate + ' bpm · ' +
            Number(data.steps).toLocaleString() + ' steps · ' + data.label;
        })
        .catch(function () {
          syncNote.className = '';
          syncNote.textContent = 'Request failed';
        });
    });
  </script>
</body>
</html>
